game_refund_other_cancel: "{prefix}&fThe opponent has cancelled the game. You got the pot of &a{pot}$&f!"
game_refund_cancel: "{prefix}&fGame has been cancelled. &a{bet}$ &fhas been refunded to your balance!"
game_lost_due_cancel: "{prefix}&cYou lost your &a{bet}$ &cbet because you cancelled the game!"

won_bet: "{prefix}&fYou won the bet! You received &a{pot}$ &ffrom the pot!"
draw_pot: "{prefix}&fThe game ended in a draw! You received &a{bet}$ &ffrom the pot!"
lost_bet: "{prefix}&cYou lost the bet! You lost your &a{bet}$ &c!"

max_bet: "{prefix}&cYou can't bet more than &a{max}$&c!"
min_bet: "{prefix}&cYou can't bet less than &a{min}$&c!"

# When one of the player exit out of game GUI
game_closed: "{prefix}&cGame has been closed"

leaderboard:

    # If you dont want to use header or footer, simply remove them
    header: "&a&m-+-----------------&r&a[&bConnectFour&a]&a&m-----------------+-"
    footer: "&a&m-+----------------------------------------------+-"

    # Keep in mind that this array have to be sorted
    symbols: ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩"]

    # How many players should be showed up
    # MAX = 10
    # MIN = 1
    entries: 10

    entry: "     &e{symbol} &7{player} &f- &9{wins} wins  &7(&fWinRate: {winrate}&7)"

gui:
    title: "&6&lConnectFour"

    yellow: "&eYellow"
    red: "&cRed"
    draw: "&6&lDRAW"
    win: "&a&lWIN"
    winner: "&e&lWINNER"

    border_item_lore:
        - " "
        - "&7&l| &fOn move: &9{player}"

    # Player heads in the GUI
    skull:
        name: "&9{player}"
        lore:
            - " "
            - "&7&l| &7Color: {color}"

    pot:
        name: "&6&lPot: &a{pot}$"
        lore:
            - " "
            - "&7&l| &fEach player bet: &a{bet}$"
invite:
    # Modify this if you are running CraftBukkit platform
    bukkit_invite: "&aYou have been invited to a game by &e{player}&7. Type &a/c4 accept {player} &7to accept or &c/c4 reject {player} &7to reject"

    # If you dont want to use header or footer, simply remove them
    header: "&a&m-+-----------------&r&a[&bConnectFour&a]&a&m-----------------+-"
    footer: "&a&m-+----------------------------------------------+-"

    # Text that will be between header and clickable buttons. (second line)
    text: "&fYou have been invited to a game by &e&l{player}"

    # Clickable buttons
    accept:
        text: "&7[&aACCEPT&7]"
        hover: "&aClick to accept"

    reject:
        text: "&7[&cREJECT&7]"
        hover: "&cClick to reject"

    # This text below will be centered between the header and footer
    buttons: "{button1}    {button2}"

help:

    # If you dont want to use header or footer, simply remove them
    header: "&a&m-+-----------------&r&a[&bConnectFour&a]&a&m-----------------+-"
    footer: "&a&m-+----------------------------------------------+-"

    entry: " &9&l➢ &7{command} &8- &f{description}"

    descriptions:
        stats: "View stats"
        leaderboard: "View leaderboard"
        invite: "Invite a player"
        accept: "Accept an invite"
        reject: "Reject an invite"
        reload: "Reload the config"

stats:

    # Should be all text centered if executor is player?
    centered: true

    # If you dont want to use header or footer, simply remove them
    header: "&a&m-+-----------------&r&a[&bConnectFour&a]&a&m-----------------+-"
    footer: "&a&m-+----------------------------------------------+-"

    text: "&e&l{player} &fstatistics"

    list:
        - " &e&l➢ &7Wins: &9{wins} &e&l⮘"
        - " &e&l➢ &7Losses: &9{losses} &e&l⮘"
        - " &e&l➢ &7Draws: &9{draws} &e&l⮘"
        - " &e&l➢ &7Win rate: &9{winrate}% &e&l⮘"
        - " &e&l➢ &7Games played: &9{gamesPlayed} &e&l⮘"
        #- " &e&l➢ &7Total bet: &a{betsTotal}$ &e&l⮘"
        #- " &e&l➢ &7Bets win rate: &9{betRate}% &e&l⮘"
        #- " &e&l➢ &7Won from bets: &a{betsWon}$ &e&l⮘"
        #- " &e&l➢ &7Lost from bets: &c{betsLost}$ &e&l⮘"