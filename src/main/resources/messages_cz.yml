invite_sent: "{prefix}&aPozval jsi hráče &e&l{player}"
invite_expired: "{prefix}&cPozvánka expirovala!"
invite_err: "{prefix}&cNastala chyba při posílání pozvánky"
invite_accept_other: "{prefix}&e{player} &apřijmul pozvánku"
invite_accept_self: "{prefix}&aPřijmul jsi pozvánku!"
invite_reject_other: "{prefix}&e{player} &codmítl pozvánku!"
invite_reject_self: "{prefix}&cOdmítl jsi pozvánku!"
move_timeout: "{prefix}&cHráč &e{player} &cnestihl udělat svůj tah včas!"
esp_confirm: "{prefix}&fPro ukončení hry odejdi z menu ještě jednou!"

not_enough_money: "{prefix}&cNemáš dostatek peněz pro start hry!"
invite_accept_no_money_target: "{prefix}&c{player} nemá dostatek peněz pro start hry!"
invite_accept_bet_withdraw: "{prefix}&fBylo ti strženo &a{bet}$ &fpro start hry!"

game_refund_other_cancel: "{prefix}&fProtihráč ukončil hru. Získal jsi &a{pot}$&f!"
game_refund_cancel: "{prefix}&fHra byla ukončena. &fBylo ti vráceno &a{bet}$&f!"
